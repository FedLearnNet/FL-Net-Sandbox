# Testing bundle: copy of local-global-cli/src/main/resources/bundles/platform/nginx.conf in which only
# the registry auth of location /v2/ is commented out (see there). Mounted by platform.override.yml.
# When the CLI file changes, copy it again and comment out that block.

upstream global-learning-backend {
    server global-learning-api:8080 resolve;
    keepalive 2;
        # Optimization to keep tcp open between nginx and learning-api:
        # https://www.f5.com/company/blog/nginx/avoiding-top-10-nginx-configuration-mistakes
    zone global_learning_zone 64k;
        # for keeping the DNS info of this container fresh
        # ~3k size are needed approximately per ip-address:port entry (256K for 88 Entries)
        # https://docs.nginx.com/nginx/admin-guide/load-balancer/http-load-balancer/#set-the-zone-size
}

upstream frontend {
    server frontend:80 resolve;
    keepalive 2;
        # Optimization to keep tcp open between nginx and frontend:
        # https://www.f5.com/company/blog/nginx/avoiding-top-10-nginx-configuration-mistakes
    zone frontend_zone 64k;
        # for keeping the DNS info of this container fresh
        # ~3k size are needed approximately per ip-address:port entry (256K for 88 Entries)
        # https://docs.nginx.com/nginx/admin-guide/load-balancer/http-load-balancer/#set-the-zone-size
}

upstream keycloak-backend {
    server keycloak:8080 resolve;
    keepalive 2;
        # Optimization to keep tcp open between nginx and keycloak:
        # https://www.f5.com/company/blog/nginx/avoiding-top-10-nginx-configuration-mistakes
    zone keycloak_zone 64k;
        # for keeping the DNS info of this container fresh
        # ~3k size are needed approximately per ip-address:port entry (256K for 88 Entries)
        # https://docs.nginx.com/nginx/admin-guide/load-balancer/http-load-balancer/#set-the-zone-size
}

upstream relay-http-server {
    server relay-server:9141 resolve;
    keepalive 2;
        # Optimization to keep tcp open between nginx and relay-server:
        # https://www.f5.com/company/blog/nginx/avoiding-top-10-nginx-configuration-mistakes
    zone relay_zone 64k;
        # for keeping the DNS info of this container fresh
        # ~3k size are needed approximately per ip-address:port entry (256K for 88 Entries)
        # https://docs.nginx.com/nginx/admin-guide/load-balancer/http-load-balancer/#set-the-zone-size
}

upstream documentation-backend {
    server documentation:80 resolve;
    keepalive 2;
        # Optimization to keep tcp open between nginx and documentation:
        # https://www.f5.com/company/blog/nginx/avoiding-top-10-nginx-configuration-mistakes
    zone documentation_zone 64k;
        # for keeping the DNS info of this container fresh
        # ~3k size are needed approximately per ip-address:port entry (256K for 88 Entries)
        # https://docs.nginx.com/nginx/admin-guide/load-balancer/http-load-balancer/#set-the-zone-size
}

upstream registry-backend {
    server registry:5000 resolve;
    keepalive 2;
    zone registry_zone 64k;
}

# https://distribution.github.io/distribution/recipes/nginx/
map $request_method $registry_read {
    default 0;
    GET     1;
    HEAD    1;
}
map $http_authorization $registry_pusher {
    default 0;
    "Basic ${REGISTRY_PUSH_BASIC_AUTH}" 1;
}
map "$registry_read$registry_pusher" $registry_denied {
    default 0;
    "00"    1;
}


server {
    # The listen directives are mounted in the container and found in the
    # listener-server-snippets directory.
    include /etc/nginx/listener-server-snippets/*.conf;

    # SSL directives are mounted only for the encrypted profile and included optionally.
    # Using a wildcard keeps the no-ssl profile valid when this directory is empty.
    include /etc/nginx/ssl-server-snippets/*.conf;

    server_name ${NGINX_HOST};

    # Overwrite forwarded headers; the public Keycloak URL stays fixed by KC_HOSTNAME.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port "";

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # Keep redirects relative so host:port from the original request is preserved.
    # This avoids dropping non-default externally mapped ports (e.g. :8250 -> container :443).
    absolute_redirect off;


    # Security Headers
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    # restrict what features can be used in the browser, removing e.g. camera, microphone, geolocation, payment
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # The data modeler is not exposed: frontends and FL clients reach it through the global API (/api/data-modeler/),
    # which checks the login and forwards the token.

    # Quarkus endpoints (health, metrics, openapi) are only for container health checks, not public
    location ^~ /api/q/ {
        return 404;
    }

    location /relay/ {
        proxy_pass http://relay-http-server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://global-learning-backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $websocket_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /api/query/sse {
        proxy_pass http://global-learning-backend/query/sse;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ——— SSE support ———
        proxy_http_version 1.1;
        proxy_set_header Connection '';
            # will be set to alive due to TCP default of HTTP1.1
        proxy_buffering off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        # ——————————————————————————
    }

    # Restricted locations must precede the broader public regex below.
    location ~ "^/auth/(admin|realms/master)([/;]|$)" {
        include /etc/nginx/keycloak-snippets/admin-access.conf;
        proxy_pass http://keycloak-backend;
    }

    # Also protect master discovery through the RFC 8414 aliases.
    location ~ "^/(auth/)?\.well-known/[^/]+/realms/master([/;]|$)" {
        include /etc/nginx/keycloak-snippets/admin-access.conf;
        rewrite ^/\.well-known/(.*)$ /auth/.well-known/$1 break;
        proxy_pass http://keycloak-backend;
    }

    # Includes login, required actions, identity-provider callbacks and logout.
    location ~ ^/auth/(realms|resources|\.well-known)/ {
        proxy_pass http://keycloak-backend;
    }

    # Plain prefix lets the master restriction above take precedence.
    location /.well-known/ {
        proxy_pass http://keycloak-backend/auth/.well-known/;
    }

    # Block other Keycloak endpoints, including health, metrics and welcome.
    location /auth {
        return 404;
    }

    location /v2/ {
        # Deactivated as the build pipeline push determines whether it needs auth based on
        # a GET /v2/ and then doesn't use auth using normal docker build in the build pipeline
        # docker buildx on the contrary uses auth BUT doesn't use the hosts docker daemon
        # therefore it pushes to the wrong registry
        # (tries to connect something in the build container)
        # if ($registry_denied) {
        #     add_header WWW-Authenticate 'Basic realm="FL-Net tool registry"' always;
        #     add_header Docker-Distribution-Api-Version registry/2.0 always;
        #     return 401;
        # }
        proxy_pass http://registry-backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # image layers: no size limit, streamed instead of buffered
        client_max_body_size 0;
        chunked_transfer_encoding on;
        proxy_request_buffering off;
        proxy_read_timeout 900s;

        proxy_http_version 1.1;
        proxy_set_header   "Connection" "";
    }

    location /documentation/ {
        proxy_pass http://documentation-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   "Connection" "";
            # Keeps the underlying TCP connection alive by default
            # That's more efficient but by default nginx doesn't do it
            # due to legacy support
    }
}
